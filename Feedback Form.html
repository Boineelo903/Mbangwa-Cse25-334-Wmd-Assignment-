<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback | Nolo Cosmetics</title>
     <!-- External CSS (make sure style.css is in the same folder) -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
 
    <header>
        <div class="logo">
            <h1>Nolo Cosmetics</h1>
            <p class="tagline">Unleash Your Beauty</p>
        </div>
        <nav>
            <ul>  
                <li><a href="index.html">Home</a></li>
                <li><a href="About Us.html">About Us</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Contact Us.html">Contact Us</a></li>
                <li><a href="Feedback Form.html">Feedback</a></li>
                <li><a href="Cart.html">Cart</a></li>
              
            </ul>
        </nav>
        
</div>
 
    </header>
 
    <main class="page-content">
        <h2>We Value Your Feedback</h2>
        <p class="subtitle">Help us improve by sharing your experience with Nolo Cosmetics.</p>
 
        <div class="feedback-form-container">
            <form action="#" method="post">
                <!-- Personal Info -->
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. Boitumelo Kgosi" required />
 
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="boitumelo.k@example.com" required />
 
                <!-- Rating -->
                <label for="rating">Overall Rating</label>
                <select id="rating" name="rating">
                    <option value="5"> Excellent</option>
                    <option value="4"> Very Good</option>
                    <option value="3"> Good</option>
                    <option value="2"> Fair</option>
                    <option value="1"> Poor</option>
                </select>
 
                <!-- Product Liked -->
                <label for="product">Which product did you try?</label>
                <select id="product" name="product">
                    <option value="lipstick">Velvet Rose Lipstick</option>
                    <option value="palette">Golden Luxe Palette</option>
                    <option value="primer">Radiance Glow Primer</option>
                    <option value="mascara">Dramatic Volume Mascara</option>
                    <option value="spray">Dewy Finish Setting Spray</option>
                    <option value="blush">Peach &amp; Rose Blush Duo</option>
                    <option value="other">Other</option>
                </select>
 
                <!-- Detailed Feedback -->
                <label for="feedback">Your Feedback</label>
                <textarea id="feedback" name="feedback" rows="6" placeholder="Tell us about your experience, suggestions, or anything else..." required></textarea>
 
                <!-- Submit -->
                <button type="submit" class="btn-primary">Submit Feedback</button>
            </form>
        </div>
    </main>
 
    <footer>
        <p>&copy; 2026 Nolo Cosmetics. All rights reserved.</p>
        <p>Follow us on Instagram &amp; Facebook @nolocosmetics</p>
    </footer>
 
</body>
</html>
